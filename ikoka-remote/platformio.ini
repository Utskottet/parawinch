; PlatformIO Project Configuration File
; Target: Fork Ikoka Nano PCB
;         Seeed XIAO nRF52840 Plus + EBYTE E22-900M30S (SX1262 + PA + LNA)
; Framework: Adafruit nRF52 BSP (includes Bluefruit BLE stack)
;
; Two environments:
;   ikoka    -- the remote firmware (port of ../remote)
;   selftest -- hardware bring-up / diagnostic firmware, serial menu on USB CDC
;
; Build/flash:  pio run -e ikoka    --target upload
;               pio run -e selftest --target upload

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-plus
framework = arduino

lib_deps =
    lennarthennigs/Button2@^2.3.5
    jgromes/RadioLib@^7.1.2

monitor_speed = 115200
; The XIAO's USB CDC is native to the nRF52840 -- no DTR/RTS-driven auto-reset
; circuit like the M5Stack's CH9102, so these only affect the host handshake.
monitor_dtr = 1
monitor_rts = 1

[env:ikoka]
build_src_filter = +<*> -<selftest/>

[env:selftest]
build_src_filter = +<selftest/>
; RADIOLIB_LOW_LEVEL exposes getStatus()/getDeviceErrors()/readRegister(),
; which is how the self-test reads the SX1262's XOSC_START_ERR and friends.
build_flags = -D RADIOLIB_LOW_LEVEL=1
